name: Build and Deploy News Dashboard

# 設定觸發條件
on:
  schedule:
    # 每天 UTC 0 點 (台灣時間早上 8 點) 自動執行
    - cron: '0 0 * * *'
  # 允許我們在 GitHub 網頁上手動點擊執行
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 抓取你的程式碼
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 安裝 requirements.txt 裡面的套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 建立 public 資料夾，並執行你的爬蟲程式
      # 這裡我們把輸出的檔案強制命名為 index.html，這是網頁伺服器的預設首頁
      - name: Run script and generate HTML
        run: |
          mkdir public
          python news_dashboard.py -o public/index.html --no-browser

      # 5. 將 public 資料夾內的產出物，推送到 gh-pages 分支做成網頁
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
